# Recipe: Qwen3.5-122B-A10B-INT4-Autoround
# Qwen3.5-122B model in Intel INT4-Autoround quantization
# Important: set memory utilization in GB, not percentage! Requires --no-ray to fit full context on two sparks.
# If you experience node shutdown, please limit GPU clocks on the affected node (or both): `sudo nvidia-smi -lgc 200,2150`

recipe_version: "1"
name: Qwen3.5-397B-INT4-Autoround
description: EXPERIMENTAL recipe for Qwen3.5-397B-INT4-Autoround
model: Intel/Qwen3.5-397B-A17B-int4-AutoRound
cluster_only: true
container: vllm-node-tf5
mods:
  - mods/fix-qwen3.5-chat-template
  - mods/gpu-mem-util-gb  
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization_gb: 107
  max_model_len: 262144
  max_num_batched_tokens: 4444
env:
  PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  VLLM_MARLIN_USE_ATOMIC_ADD: 1
  NCCL_IB_HCA: "rocep1s0f0,roceP2p1s0f0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_DEBUG: "INFO"
  NCCL_SOCKET_IFNAME: "enp1s0f0np0"
  NCCL_IB_TIMEOUT: "30"
  NCCL_IB_RETRY_CNT: "7"
command: |
  vllm serve /models/Intel/Qwen3.5-397B-A17B-int4-AutoRound \
    --max-model-len {max_model_len} \
    --max-num-seqs 4   \
    --kv-cache-dtype fp8 \
    --gpu-memory-utilization-gb {gpu_memory_utilization_gb} \
    --port {port} \
    --host {host} \
    --enable-prefix-caching \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser qwen3 \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --trust-remote-code \
    -tp {tensor_parallel}    

  
