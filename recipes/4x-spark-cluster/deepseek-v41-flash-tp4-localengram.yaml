recipe_version: "1"
# 2026-09-13: thinking ON by default (reasoning_effort "high" = budget 75/100) so harnesses without a
# thinking switch still get it. Per-request override: chat_template_kwargs {"thinking": false} or
# {"reasoning_effort": "low"|"high"|"max"|1-100}; output_config.effort also maps to the budget.
# MEASURED 2026-09-12 (this recipe, node-local Engram on all 4 ranks): healthy in 14 min; KV pool
# 3,301,257 tokens (6.3 x 512K); coherent. Single stream: code 73-75 / prose 35 / count 99 tok/s,
# step 61-67 ms, DSpark accept 3.7-3.9 of 5 on code; decode@31K 73.6; cold prefill 1,542 tok/s @31K
# and 1,681 tok/s @62K (was 487 with Engram over NFS). GLM-5.3 tuned on the same nodes: 33/22/41.
# DeepSeek-V4.1-Flash TP4 with NODE-LOCAL Engram rows (second-boot config). Same as
# deepseek-v41-flash-tp4.yaml except DSV41_ENGRAM_LOCAL=1; the launcher must be given the mount:
#   VLLM_SPARK_EXTRA_DOCKER_ARGS="-v /var/tmp/engram-local/DeepSeek-V4.1-Flash:/engram-local:ro"
# (launch/deepseek-v41-flash-local.sh does exactly that). Requires the per-rank copies built by
# ~/dsv41-engram-copy.sh (48 GB per node, ranges in the base recipe header). Boot log must show
# "Engram ... /engram-local" instead of "DSV41_ENGRAM_DIR=/engram-local unusable".
name: DeepSeek-V4.1-Flash-TP4-localengram
description: "DeepSeek-V4.1-Flash MXFP4 on 4x DGX Spark: TP4, DSpark k=5, node-local Engram rows, 512K ctx"

model: deepseek-ai/DeepSeek-V4.1-Flash
container: dsv41-flash-b12x:local
cluster_only: true

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 4
  gpu_memory_utilization: 0.85
  max_model_len: 524288
  max_num_batched_tokens: 8192

env:
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_HCA: "mlx5_0,mlx5_2"
  NCCL_SOCKET_IFNAME: "enP7s7,enp1s0f0np0,enP2p1s0f0np0"
  GLOO_SOCKET_IFNAME: "enp1s0f0np0"
  NCCL_IB_GID_INDEX: "-1"
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_CROSS_NIC: "1"
  NCCL_IGNORE_CPU_AFFINITY: "1"

  HF_HUB_OFFLINE: "1"
  # Engram tables stay on disk; 32 parallel row reads, 16 MB chunks
  DSV41_ENGRAM_DISK: "1"
  DSV41_ENGRAM_DISK_THREADS: "32"
  DSV41_ENGRAM_DISK_CHUNK: "16"
  # set to "1" + mount /engram-local once the node-local copies exist (see header)
  DSV41_ENGRAM_LOCAL: "1"
  DSV41_ENGRAM_DIR: "/engram-local"
  # CUDA graphs: Engram rows staged in prepare_inputs (baked patch)
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  VLLM_HAS_FLASHINFER_CUBIN: "1"
  VLLM_USE_RUST_FRONTEND: "0"
  MAX_JOBS: "2"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_CUDA_ARCH_LIST: "12.1a"
  FLASHINFER_CUDA_ARCH_LIST: "12.1a"
  OMP_NUM_THREADS: "2"
  B12X_CACHE_DIR: /root/.cache/b12x

command: |
  vllm serve deepseek-ai/DeepSeek-V4.1-Flash \
    --revision dba1be0a40aa45a94ad051997016db3960a90277 \
    --served-model-name deepseek-v4.1-flash \
    --moe-backend b12x \
    --trust-remote-code \
    --tensor-parallel-size 4 \
    --gpu-memory-utilization 0.85 \
    --max-model-len 524288 \
    --max-num-seqs 8 \
    --max-num-batched-tokens 8192 \
    --block-size 128 \
    --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","cudagraph_capture_sizes":[5,6,10,12,15,18,20,24,25,30,35,36,40,42,48]}}' \
    --speculative-config '{{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic","rejection_sample_method":"block","enable_adaptive_verification":false}}' \
    --tool-call-parser deepseek_v41 \
    --enable-auto-tool-choice \
    --reasoning-parser deepseek_v41 \
    --default-chat-template-kwargs '{{"thinking": true, "reasoning_effort": "high"}}' \
    --host {host} \
    --port {port}

mods: []
